openapi: 3.0.3

info:
  title: Travel Lab API
  version: 1.0.0
  description: |
    API мобильного приложения Travel Lab (учебный клон сценария бронирования отеля).
    Описаны пять запросов основного сценария, по одному на экран:

    | Экран приложения | Запрос |
    |---|---|
    | Выдача отелей и карта | `GET /hotels` |
    | Карточка отеля и отзывы | `GET /hotels/{hotelId}` |
    | Выбор номера | `GET /hotels/{hotelId}/rooms` |
    | Оформление | `POST /bookings` |
    | Подтверждение | `GET /bookings/{bookingId}` |

    **Соглашения**
    - Формат обмена: JSON, кодировка UTF-8.
    - Деньги: целые рубли. Цены в каталоге указаны за одну ночь, итог считает сервер.
    - Даты: `yyyy-MM-dd`, время: `HH:mm`.
    - Оформление без входа в аккаунт, поэтому авторизации и кода 401 в сценарии нет.
    - Фильтры выдачи (цена, звёзды, питание и т. д.) и сортировка выполняются в приложении
      над полученным списком, сервер их не принимает.
    - Отсутствие результатов не ошибка: сервер отвечает `200` с пустым массивом.
    - Ошибки приходят в едином формате `Error`, поле `code` позволяет приложению различать
      причины внутри одного HTTP-статуса.
    - Отсутствие сети — состояние клиента, у него нет HTTP-кода, в спецификации оно не описывается.

servers:
  - url: https://api.travel-lab.example/v1
    description: Условный адрес. В приложении запросы обслуживает встроенная заглушка.

tags:
  - name: Search
    description: Экран «Выдача» и карта
  - name: Hotel
    description: Экран «Карточка отеля» и «Отзывы»
  - name: Rooms
    description: Экран «Выбор номера»
  - name: Booking
    description: Экраны «Оформление» и «Подтверждение»

paths:
  /hotels:
    get:
      tags: [Search]
      operationId: searchHotels
      summary: Поиск отелей
      description: |
        **Экран:** «Выдача отелей» (и «На карте»).
        **Действие пользователя:** нажал «Найти» в форме поиска, открыл выдачу с главного
        или изменил параметры поиска в шапке выдачи.

        Возвращает отели города с ценой за ночь и координатами для карты. Если ничего
        не найдено, это нормальный результат: `200` и `items: []`, а не `404`.
        Если даты не заданы, сервер считает одну ночь.
      parameters:
        - name: city
          in: query
          required: true
          description: Город из подсказок поиска.
          schema: { type: string, example: Москва }
        - name: checkIn
          in: query
          description: Дата заезда. Вместе с `checkOut`; без дат считается одна ночь.
          schema: { type: string, format: date, example: '2026-11-20' }
        - name: checkOut
          in: query
          description: Дата выезда, строго позже заезда.
          schema: { type: string, format: date, example: '2026-11-21' }
        - name: adults
          in: query
          description: Число взрослых.
          schema: { type: integer, minimum: 1, maximum: 10, default: 1 }
        - name: children
          in: query
          description: Число детей.
          schema: { type: integer, minimum: 0, maximum: 6, default: 0 }
        - name: rooms
          in: query
          description: Число номеров, не больше числа взрослых.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: type
          in: query
          description: Тип размещения.
          schema:
            type: string
            enum: [any, hotels, apartments]
            default: any
      responses:
        '200':
          description: Список отелей. Может быть пустым.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelSearchResult'
              examples:
                found:
                  summary: Найдено два отеля
                  value:
                    items:
                      - id: '3'
                        name: Автор на Павелецкой
                        type: Хостел
                        rating: 4.7
                        reviewsCount: 608
                        street: Павелецкая набережная
                        distanceKm: 2.7
                        location: { lat: 55.7706, lon: 37.6515 }
                        pricePerNight: 1089
                        oldPricePerNight: 1210
                        badge: fewRooms
                        recommended: true
                        freeCancellation: true
                        mealPlan: none
                        stars: 0
                        wifi: true
                        parking: false
                        imageHue: 40
                      - id: '2'
                        name: The Loft
                        type: Гостиница
                        rating: 4.9
                        reviewsCount: 87
                        street: Тверская улица
                        distanceKm: 1.2
                        location: { lat: 55.7567, lon: 37.5982 }
                        pricePerNight: 2079
                        badge: appOnly
                        recommended: true
                        freeCancellation: false
                        mealPlan: breakfast
                        stars: 4
                        wifi: true
                        parking: true
                        imageHue: 200
                empty:
                  summary: Ничего не найдено (не ошибка)
                  value: { items: [] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /hotels/{hotelId}:
    get:
      tags: [Hotel]
      operationId: getHotel
      summary: Карточка отеля
      description: |
        **Экран:** «Карточка отеля», он же источник данных для экрана «Отзывы».
        **Действие пользователя:** нажал на отель в выдаче, на карте или в «Недавно смотрели».

        Возвращает всё, что показывает страница отеля: описание, удобства, правила, оценки по
        категориям и отзывы. Отзывов не больше шести, поэтому постраничной выдачи нет.
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '200':
          description: Отель найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelDetails'
              examples:
                hotel:
                  value:
                    id: '3'
                    name: Автор на Павелецкой
                    type: Хостел
                    rating: 4.7
                    reviewsCount: 608
                    street: Павелецкая набережная
                    distanceKm: 2.7
                    pricePerNight: 1089
                    oldPricePerNight: 1210
                    badge: fewRooms
                    recommended: true
                    freeCancellation: true
                    mealPlan: none
                    stars: 0
                    wifi: true
                    parking: false
                    imageHue: 40
                    description: Хостел «Автор на Павелецкой» находится в удобной части города, рядом с остановками транспорта и магазинами.
                    topAmenities: [laundry, wifi, delivery]
                    amenities: [luggage, laundry, wifi, delivery, cleaning, taxi, frontDesk]
                    checkIn: { from: '14:00', to: '00:00' }
                    checkOut: { from: '00:00', to: '12:00' }
                    rules:
                      - { title: Стойка регистрации, note: 24/7 }
                      - { title: Ранний заезд, note: 'Платно, с 00:00' }
                      - { title: Ускоренная регистрация заезда/отъезда }
                    categoryScores:
                      - { category: Цена/качество, score: 94 }
                      - { category: Чистота номеров, score: 83 }
                    landmark: { name: Центр, distanceM: 945 }
                    buildYear: 2006
                    renovationYear: 2019
                    roomsCount: 47
                    reviews:
                      - author: Дмитрий
                        date: '2026-07-14'
                        rating: 4
                        text: Удобная кровать, быстрый интернет, рядом много кафе.
                        stay: { month: '2026-07', nights: 1 }
                        regularGuest: false
                        hotelReply: Благодарим за отзыв, нам важно ваше мнение.
                      - author: Ольга
                        date: '2026-06-30'
                        rating: 5
                        text: Отличный сервис и вежливые сотрудники. Рекомендую.
                        stay: { month: '2026-06', nights: 2 }
                        regularGuest: false
        '404':
          $ref: '#/components/responses/HotelNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /hotels/{hotelId}/rooms:
    get:
      tags: [Rooms]
      operationId: getHotelRooms
      summary: Номера и тарифы на даты
      description: |
        **Экран:** «Выбор номера».
        **Действие пользователя:** нажал «Выбрать» на карточке отеля.

        Возвращает номера, свободные на указанные даты, и тарифы каждого номера. Если свободных
        номеров нет, это не ошибка: `200` и `rooms: []`, приложение покажет состояние
        «Нет свободных номеров» и предложит сменить даты.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - name: checkIn
          in: query
          required: true
          schema: { type: string, format: date, example: '2026-11-20' }
        - name: checkOut
          in: query
          required: true
          description: Строго позже `checkIn`.
          schema: { type: string, format: date, example: '2026-11-21' }
        - name: adults
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 1 }
        - name: children
          in: query
          schema: { type: integer, minimum: 0, maximum: 6, default: 0 }
      responses:
        '200':
          description: Номера и тарифы. Массив `rooms` может быть пустым.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsResult'
              examples:
                available:
                  value:
                    rooms:
                      - id: r0
                        title: Кровать в общем 8-местном номере для мужчин и женщин
                        areaM2: 15
                        beds: 1 односпальная кровать
                        imageHue: 40
                        roomsLeft: 3
                        amenityGroups:
                          - { title: Интернет и телефония, items: [Интернет] }
                        offers:
                          - id: o0
                            mealPlan: none
                            freeCancellationUntil: null
                            pricePerNight: 1089
                            oldPricePerNight: 1210
                          - id: o1
                            mealPlan: none
                            freeCancellationUntil: '2026-11-19'
                            pricePerNight: 1310
                      - id: r1
                        title: Кровать в общем 4-местном номере
                        areaM2: 12
                        beds: 1 односпальная кровать
                        imageHue: 65
                        amenityGroups:
                          - { title: Интернет и телефония, items: [Интернет] }
                        offers:
                          - id: o0
                            mealPlan: none
                            freeCancellationUntil: '2026-11-19'
                            pricePerNight: 1630
                soldOut:
                  summary: На эти даты номеров нет (не ошибка)
                  value: { rooms: [] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/HotelNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings:
    post:
      tags: [Booking]
      operationId: createBooking
      summary: Оформить бронирование
      description: |
        **Экран:** «Оформление».
        **Действие пользователя:** нажал «Оплатить».

        Сервер заново проверяет доступность тарифа и считает итоговую сумму (скидка тарифа,
        промокод, поздний выезд). Если сумма не совпадает с `expectedTotal`, бронь не создаётся:
        ответ `409` с кодом `PRICE_CHANGED` и новой суммой в `currentTotal`. Приложение
        показывает «Цена изменилась», и после согласия гостя отправляет запрос повторно.

        **Повторная отправка.** Заголовок `Idempotency-Key` приложение создаёт один раз на попытку
        оформления. Если ответ потерян (обрыв сети), повтор с тем же ключом и тем же телом
        вернёт уже созданную бронь с кодом `200`, а не создаст вторую.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Уникальный ключ попытки оформления (UUID).
          schema: { type: string, format: uuid }
          example: 2f6b9c1e-8a53-4d27-9b41-3c5f0a7d1e22
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
            examples:
              full:
                summary: Оплата полной суммой
                value:
                  hotelId: '3'
                  roomId: r0
                  offerId: o0
                  checkIn: '2026-11-20'
                  checkOut: '2026-11-21'
                  adults: 1
                  children: 0
                  guests:
                    - { lastName: Иванов, firstName: Иван }
                  contact: { email: ivan.ivanov@example.com, phone: '+7 900 123-45-67' }
                  lateCheckout: false
                  payment: { mode: full, method: mastercard }
                  expectedTotal: 1035
              splitWithPromo:
                summary: Сплит и промокод
                value:
                  hotelId: '3'
                  roomId: r0
                  offerId: o0
                  checkIn: '2026-11-20'
                  checkOut: '2026-11-21'
                  adults: 1
                  guests:
                    - { lastName: Иванов, firstName: Иван }
                  contact: { email: ivan.ivanov@example.com, phone: '79001234567' }
                  promoCode: LAB10
                  payment: { mode: split, method: sbp }
                  expectedTotal: 931
      responses:
        '201':
          description: Бронь создана и подтверждена.
          headers:
            Location:
              description: Адрес созданной брони.
              schema: { type: string, example: /bookings/bk_5e8d2a }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                created:
                  $ref: '#/components/examples/BookingExample'
        '200':
          description: Повтор запроса с тем же `Idempotency-Key`. Возвращена ранее созданная бронь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                replay:
                  $ref: '#/components/examples/BookingExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Отель, номер или тариф не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                offerNotFound:
                  value: { code: OFFER_NOT_FOUND, message: Тариф не найден }
        '409':
          description: |
            Бронь создать нельзя. `OFFER_UNAVAILABLE`: тариф уже раскуплен, гостю предлагается
            выбрать другой номер. `PRICE_CHANGED`: цена изменилась, в `currentTotal` новая сумма.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                offerUnavailable:
                  summary: Тариф раскуплен
                  value: { code: OFFER_UNAVAILABLE, message: Этот номер уже забронирован }
                priceChanged:
                  summary: Цена изменилась
                  value: { code: PRICE_CHANGED, message: Цена изменилась, currentTotal: 1080 }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings/{bookingId}:
    get:
      tags: [Booking]
      operationId: getBooking
      summary: Бронь по номеру
      description: |
        **Экран:** «Подтверждение».
        **Действие пользователя:** оплата прошла, открылся экран «Бронирование подтверждено».

        Экран загружает бронь по идентификатору из ответа `POST /bookings`: так страницу
        можно открыть повторно и данные приходят с сервера, а не из памяти приложения.
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, example: bk_5e8d2a }
      responses:
        '200':
          description: Бронь найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                booking:
                  $ref: '#/components/examples/BookingExample'
        '404':
          description: Бронь не найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value: { code: BOOKING_NOT_FOUND, message: Бронь не найдена }
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    HotelId:
      name: hotelId
      in: path
      required: true
      description: Идентификатор отеля из выдачи.
      schema: { type: string, example: '3' }

  responses:
    BadRequest:
      description: |
        Некорректные параметры запроса: нет города, выезд не позже заезда, значение вне диапазона.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badDates:
              value: { code: INVALID_PARAMETER, message: Дата выезда должна быть позже даты заезда }
    HotelNotFound:
      description: Отель не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value: { code: HOTEL_NOT_FOUND, message: Отель не найден }
    ValidationFailed:
      description: |
        Тело запроса корректно по формату, но данные не прошли проверку. В `fields` перечислены
        поля с ошибками, приложение показывает их под соответствующими полями формы.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidContact:
              value:
                code: VALIDATION_FAILED
                message: Проверьте введённые данные
                fields:
                  - { field: contact.email, message: Некорректная почта }
                  - { field: 'guests[0].lastName', message: Обязательное поле }
            invalidPromo:
              value:
                code: VALIDATION_FAILED
                message: Проверьте введённые данные
                fields:
                  - { field: promoCode, message: Промокод не найден }
    InternalError:
      description: Внутренняя ошибка сервера. Запрос можно повторить позже.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal:
              value: { code: INTERNAL_ERROR, message: Что-то пошло не так. Попробуйте ещё раз }

  examples:
    BookingExample:
      value:
        id: bk_5e8d2a
        number: TL-482915
        hotel:
          name: Автор на Павелецкой
          street: Павелецкая набережная
          checkIn: { from: '14:00', to: '00:00' }
          checkOut: { from: '00:00', to: '12:00' }
        room:
          title: Кровать в общем 8-местном номере для мужчин и женщин
          beds: 1 односпальная кровать
          imageHue: 40
          amenities: [Интернет]
        offer: { mealPlan: none, freeCancellationUntil: null }
        checkIn: '2026-11-20'
        checkOut: '2026-11-21'
        guests:
          - { lastName: Иванов, firstName: Иван }
        contact: { email: ivan.ivanov@example.com, phone: '+7 900 123-45-67' }
        lateCheckout: false
        payment: { mode: full, method: mastercard, total: 1035, paidNow: 1035 }

  schemas:
    MealPlan:
      type: string
      description: Питание, включённое в цену.
      enum: [none, breakfast, breakfastDinner, allInclusive]

    Amenity:
      type: string
      description: Удобство отеля.
      enum: [laundry, delivery, wifi, parking, breakfast, luggage, cleaning, taxi, frontDesk]

    GeoPoint:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lon: { type: number, format: double, minimum: -180, maximum: 180 }

    HotelBase:
      type: object
      description: Поля отеля, общие для выдачи и карточки.
      required:
        - id
        - name
        - type
        - rating
        - reviewsCount
        - street
        - distanceKm
        - pricePerNight
        - imageHue
      properties:
        id: { type: string, example: '3' }
        name: { type: string }
        type:
          type: string
          description: Тип объекта.
          enum: [Гостиница, Мини-отель, Хостел, Апартаменты]
        rating: { type: number, format: float, minimum: 0, maximum: 5 }
        reviewsCount: { type: integer, minimum: 0 }
        street: { type: string }
        distanceKm: { type: number, format: float, minimum: 0, description: 'Расстояние до центра города, км.' }
        pricePerNight: { type: integer, minimum: 0, description: 'Цена за ночь, ₽.' }
        oldPricePerNight:
          type: integer
          nullable: true
          description: 'Цена за ночь до скидки, ₽. Нет скидки: поле отсутствует или `null`.'
        badge:
          type: string
          description: 'Плашка над фото. Нет плашки: поля нет.'
          enum: [fewRooms, appOnly]
        recommended: { type: boolean, default: false }
        freeCancellation: { type: boolean, default: false }
        mealPlan: { $ref: '#/components/schemas/MealPlan' }
        stars: { type: integer, minimum: 0, maximum: 5, default: 0, description: 'Число звёзд, 0 без звёзд.' }
        wifi: { type: boolean, default: true }
        parking: { type: boolean, default: false }
        imageHue:
          type: number
          minimum: 0
          maximum: 360
          description: 'Оттенок заглушки вместо фото (0–360). В боевом API здесь был бы список ссылок на фото.'

    HotelSummary:
      description: 'Отель в выдаче и на карте: общие поля и координаты.'
      allOf:
        - $ref: '#/components/schemas/HotelBase'
        - type: object
          required: [location]
          properties:
            location: { $ref: '#/components/schemas/GeoPoint' }

    HotelSearchResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HotelSummary' }

    TimeWindow:
      type: object
      required: [from, to]
      properties:
        from: { type: string, pattern: '^\d{2}:\d{2}$', example: '14:00' }
        to: { type: string, pattern: '^\d{2}:\d{2}$', example: '00:00' }

    Rule:
      type: object
      required: [title]
      properties:
        title: { type: string }
        note: { type: string, nullable: true }

    CategoryScore:
      type: object
      required: [category, score]
      properties:
        category: { type: string, example: Чистота номеров }
        score: { type: integer, minimum: 0, maximum: 100 }

    Landmark:
      type: object
      required: [name, distanceM]
      properties:
        name: { type: string, example: Центр }
        distanceM: { type: integer, minimum: 0 }

    Stay:
      type: object
      description: Когда и на сколько гость останавливался.
      required: [month, nights]
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-09' }
        nights: { type: integer, minimum: 1 }

    Review:
      type: object
      required: [author, date, rating, text, stay]
      properties:
        author: { type: string }
        date: { type: string, format: date }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, description: 'Что понравилось.' }
        stay: { $ref: '#/components/schemas/Stay' }
        regularGuest: { type: boolean, default: false, description: 'Метка «Наш гость».' }
        hotelReply: { type: string, nullable: true }

    HotelDetails:
      description: 'Отель для страницы «Карточка отеля»: данные выдачи и подробности.'
      allOf:
        - $ref: '#/components/schemas/HotelBase'
        - type: object
          required:
            - description
            - topAmenities
            - amenities
            - checkIn
            - checkOut
            - rules
            - categoryScores
            - landmark
            - buildYear
            - renovationYear
            - roomsCount
            - reviews
          properties:
            description: { type: string }
            topAmenities:
              type: array
              maxItems: 3
              description: Удобства под названием отеля.
              items: { $ref: '#/components/schemas/Amenity' }
            amenities:
              type: array
              description: 'Полный список для раздела «Удобства и услуги».'
              items: { $ref: '#/components/schemas/Amenity' }
            checkIn: { $ref: '#/components/schemas/TimeWindow' }
            checkOut: { $ref: '#/components/schemas/TimeWindow' }
            rules:
              type: array
              items: { $ref: '#/components/schemas/Rule' }
            categoryScores:
              type: array
              items: { $ref: '#/components/schemas/CategoryScore' }
            landmark: { $ref: '#/components/schemas/Landmark' }
            buildYear: { type: integer }
            renovationYear: { type: integer }
            roomsCount: { type: integer, minimum: 1 }
            reviews:
              type: array
              maxItems: 6
              items: { $ref: '#/components/schemas/Review' }

    AmenityGroup:
      type: object
      required: [title, items]
      properties:
        title: { type: string, example: В номере }
        items:
          type: array
          items: { type: string }

    Offer:
      type: object
      description: Тариф на номер. Цены за одну ночь.
      required: [id, mealPlan, pricePerNight]
      properties:
        id: { type: string, example: o0 }
        mealPlan: { $ref: '#/components/schemas/MealPlan' }
        freeCancellationUntil:
          type: string
          format: date
          nullable: true
          description: 'Последний день бесплатной отмены. `null`: оплата не возвращается.'
        pricePerNight: { type: integer, minimum: 0 }
        oldPricePerNight: { type: integer, nullable: true }

    Room:
      type: object
      required: [id, title, areaM2, beds, imageHue, amenityGroups, offers]
      properties:
        id: { type: string, example: r0 }
        title: { type: string }
        areaM2: { type: integer, minimum: 1 }
        beds: { type: string }
        imageHue: { type: number, minimum: 0, maximum: 360 }
        roomsLeft:
          type: integer
          nullable: true
          description: 'Сколько номеров осталось. `null`: не показывать.'
        amenityGroups:
          type: array
          items: { $ref: '#/components/schemas/AmenityGroup' }
        offers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Offer' }

    RoomsResult:
      type: object
      required: [rooms]
      properties:
        rooms:
          type: array
          description: 'Свободные номера. Пустой массив: на эти даты номеров нет.'
          items: { $ref: '#/components/schemas/Room' }

    Guest:
      type: object
      required: [lastName, firstName]
      properties:
        lastName: { type: string, minLength: 1, maxLength: 50, example: Иванов }
        firstName: { type: string, minLength: 1, maxLength: 50, example: Иван }

    Contact:
      type: object
      required: [email, phone]
      properties:
        email: { type: string, format: email }
        phone:
          type: string
          pattern: '^[0-9+\-() ]{10,20}$'
          description: 'Не менее 10 цифр, допустимы `+`, скобки, пробелы и дефисы.'

    Payment:
      type: object
      required: [mode, method]
      properties:
        mode:
          type: string
          description: 'Вся сумма сразу или Сплит (четыре платежа, первый списывается сейчас).'
          enum: [full, split]
        method:
          type: string
          enum: [mastercard, sbp, mir]

    BookingRequest:
      type: object
      required:
        - hotelId
        - roomId
        - offerId
        - checkIn
        - checkOut
        - adults
        - guests
        - contact
        - payment
        - expectedTotal
      properties:
        hotelId: { type: string }
        roomId: { type: string }
        offerId: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        adults: { type: integer, minimum: 1, maximum: 10 }
        children: { type: integer, minimum: 0, maximum: 6, default: 0 }
        guests:
          type: array
          minItems: 1
          description: 'Взрослые гости по одному на каждого, количество равно `adults`.'
          items: { $ref: '#/components/schemas/Guest' }
        contact: { $ref: '#/components/schemas/Contact' }
        lateCheckout: { type: boolean, default: false, description: 'Услуга «Поздний выезд до 23:00».' }
        promoCode: { type: string, description: 'Промокод, регистр не важен.' }
        payment: { $ref: '#/components/schemas/Payment' }
        expectedTotal:
          type: integer
          minimum: 0
          description: 'Итоговая сумма, ₽, которую гость видел на экране оформления.'

    BookingHotel:
      type: object
      required: [name, street, checkIn, checkOut]
      properties:
        name: { type: string }
        checkIn: { $ref: '#/components/schemas/TimeWindow' }
        checkOut: { $ref: '#/components/schemas/TimeWindow' }
        street:
          type: string
          example: Павелецкая набережная
          description: 'Улица. Город экран берёт из параметров поиска: отели вымышленные и к городу не привязаны.'

    BookingRoom:
      type: object
      required: [title, beds, imageHue, amenities]
      properties:
        title: { type: string }
        beds: { type: string }
        imageHue: { type: number, minimum: 0, maximum: 360 }
        amenities:
          type: array
          items: { type: string }

    BookingOffer:
      type: object
      required: [mealPlan]
      properties:
        mealPlan: { $ref: '#/components/schemas/MealPlan' }
        freeCancellationUntil: { type: string, format: date, nullable: true }

    BookingPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required: [total, paidNow]
          properties:
            total: { type: integer, minimum: 0, description: 'Полная стоимость, ₽.' }
            paidNow: { type: integer, minimum: 0, description: 'Списано сейчас, ₽. Для Сплита первый платёж.' }

    Booking:
      type: object
      description: Созданная бронь. Бронь, возвращённая сервером, всегда подтверждена.
      required:
        - id
        - number
        - hotel
        - room
        - offer
        - checkIn
        - checkOut
        - guests
        - contact
        - lateCheckout
        - payment
      properties:
        id: { type: string, example: bk_5e8d2a }
        number: { type: string, example: TL-482915, description: 'Номер заказа для гостя.' }
        hotel: { $ref: '#/components/schemas/BookingHotel' }
        room: { $ref: '#/components/schemas/BookingRoom' }
        offer: { $ref: '#/components/schemas/BookingOffer' }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        guests:
          type: array
          items: { $ref: '#/components/schemas/Guest' }
        contact: { $ref: '#/components/schemas/Contact' }
        lateCheckout: { type: boolean }
        payment: { $ref: '#/components/schemas/BookingPayment' }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Путь к полю запроса.
          example: contact.email
        message: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машинный код причины. Приложение выбирает по нему состояние экрана.
          enum:
            - INVALID_PARAMETER
            - HOTEL_NOT_FOUND
            - OFFER_NOT_FOUND
            - BOOKING_NOT_FOUND
            - OFFER_UNAVAILABLE
            - PRICE_CHANGED
            - VALIDATION_FAILED
            - INTERNAL_ERROR
        message: { type: string, description: 'Текст для показа пользователю.' }
        fields:
          type: array
          description: 'Только для `VALIDATION_FAILED`.'
          items: { $ref: '#/components/schemas/FieldError' }
        currentTotal:
          type: integer
          description: 'Только для `PRICE_CHANGED`. Новая итоговая сумма, ₽.'
